# ============================================
# GRADLE PROPERTIES - Women Safety App
# ============================================

# Memory settings (keep your existing high memory config)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX (keep existing)
android.useAndroidX=true

# Flutter template flags (keep existing)
android.newDsl=false
android.builtInKotlin=false

# ============================================
# KOTLIN COMPILER SETTINGS (AI recommended)
# ============================================

# Disable Kotlin incremental compilation (helps with build issues)
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false

# Increase memory for Kotlin daemon
kotlin.daemon.jvmargs=-Xmx2g

# ============================================
# GRADLE OPTIMIZATION (AI recommended)
# ============================================

# Disable build cache (useful when facing build issues)
org.gradle.caching=false
org.gradle.configureondemand=false

# Disable parallel execution (prevents race conditions)
org.gradle.parallel=false